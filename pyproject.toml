[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-indexer"
version = "0.1.0"
description = "Resumable local keyword indexing for Russian Markdown diaries"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["diary_indexer*"]
